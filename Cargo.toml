[package]
name = "letsharness"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

description = "A fully hackable agent harness."
authors = ["potistudio <potistudio@proton.me>"]
license = "MIT"
publish = false
repository = "https://github.com/potistudio/LetsHarness"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
